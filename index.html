/* ---------- مراحل ورود به آزمون ---------- */
async function getIdDescs(){
  const r=await rpc('my_identity');
  if(!r||r.status!=='approved'||!Array.isArray(r.descriptors)||!r.descriptors.length)throw Error('identity_required');
  return r.descriptors.map(toVec);
}
function startExamFlow(e){
  if(examOpen)return;
  if(!ID||ID.status!=='approved'){toast(ER.identity_required,'err');renderMain();return}
  examOpen=true;
  const xm=H('div','xm');document.body.append(xm);document.body.classList.add('noscroll');
  let stream=null,visReady=false,visTry=0,idDescs=null,idRefs=[],idReady=false,idPassed=false,passAt=0,fvCtl=null;
  const stopStream=()=>{try{stream&&stream.getTracks().forEach(t=>t.stop())}catch{};stream=null};
  const leave=()=>{if(fvCtl)fvCtl.alive=false;stopStream();xm.remove();document.body.classList.remove('noscroll');examOpen=false;try{if(document.fullscreenElement)document.exitFullscreen()}catch{}loadExams();loadScores()};
  const stp=n=>`<div class=stp>${[0,1,2].map(i=>`<i class="${i===n?'on':''}"></i>`).join('')}</div>`;
  const setErr=m=>{const e=xm.querySelector('#pe');if(e)e.textContent=m};
  step1();
  function step1(){
    xm.innerHTML=`<div class="wz fvz">${stp(0)}<div class=wz-i>${ic('camera',38)}</div><h2>دوربین، میکروفون و تأیید چهره</h2>
    <p>دسترسی دوربین و میکروفون فعال می‌شود و چهرهٔ شما با عکس احراز هویت‌تان تطبیق داده می‌شود. صاف و رو به دوربین، در نور کافی بنشینید؛ تغییر لباس، مو یا زاویهٔ سر مشکلی ایجاد نمی‌کند. تا زمانی که چهره تأیید نشود، امکان رفتن به مرحلهٔ بعد وجود ندارد.</p>
    <div class=fv-frame id=fvf hidden><video id=pv autoplay muted playsinline></video><svg viewBox="0 0 300 400" preserveAspectRatio="none" aria-hidden=true><path class=ring d="M150 62C104 62 72 100 72 158c0 60 33 118 78 118s78-58 78-118c0-58-32-96-78-96Z"/></svg></div><div class=fv-hint id=fvh role=status aria-live=polite hidden></div>
    <div class=fv-prog id=fvp hidden><i></i></div><div class=perr id=pe role=alert></div>
    <button class="btn red blk" id=pb>اجازه دسترسی</button><button class="btn gh blk" id=pc>انصراف</button></div>`;
    const wz=xm.querySelector('.wz');
    const ui=(m,k,n,tot)=>{
      const f=xm.querySelector('#fvf'),h=xm.querySelector('#fvh'),pg=xm.querySelector('#fvp');if(!f)return;
      if(h){h.hidden=false;h.className='fv-hint '+(k==='ok'||k==='bad'?k:'');if(h.textContent!==m)h.textContent=m}
      f.classList.toggle('ok',k==='ok');f.classList.toggle('bad',k==='bad');
      if(pg){pg.hidden=false;pg.firstElementChild.style.width=Math.max(0,Math.min(100,n/tot*100))+'%'}
    };
    const noCamCheck=async x=>{
      try{
        const n=x&&x.name;
        if(!(n==='NotFoundError'||n==='DevicesNotFoundError'||(x&&x.message==='no_media')))return;
        if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent))return;
        const dv=await navigator.mediaDevices.enumerateDevices();
        if(dv.some(d=>d.kind==='videoinput'))return;
        const e=xm.querySelector('#pe');if(!e)return;
        const link=location.origin+location.pathname;
        e.innerHTML=`<div class=nocam><b>این دستگاه دوربین ندارد</b><p>آزمون فقط با دوربین ممکن است. با گوشی یا تبلت خودتان همین سایت را باز کنید و با همان نام کاربری و رمز وارد شوید.</p><div id=nqr class=nqr></div><div class=nlk dir=ltr>${esc(link)}</div><button type=button class="btn gh blk" id=ncp>کپی لینک سایت</button><p class=nsm>اگر گوشی یا تبلتی ندارید، پیش از زمان آزمون با مدیر مدرسه هماهنگ کنید.</p></div>`;
        const cp=e.querySelector('#ncp');
        if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(link);cp.textContent='کپی شد ✓'}catch{cp.textContent='لینک را به‌صورت دستی کپی کنید'}};
        try{
          if(!window.qrcode){await new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';sc.onload=ok;sc.onerror=no;document.head.append(sc);setTimeout(no,8000)})}
          const q=window.qrcode(0,'M');q.addData(link);q.make();
          const h=e.querySelector('#nqr');if(h)h.innerHTML=q.createSvgTag(4,4);
        }catch{}
      }catch{}
    };
    const showPrev=()=>{
      const v=xm.querySelector('#pv'),f=xm.querySelector('#fvf');if(!v||!f||!stream)return;
      f.hidden=false;wz.classList.add('fv-on');
      if(v.srcObject!==stream)v.srcObject=stream;
      const pl=v.play();if(pl&&pl.catch)pl.catch(()=>{});
    };
    $('#pc').onclick=leave;
    if(stream&&stream.active&&!idPassed){showPrev();$('#pb').textContent='تأیید دوبارهٔ چهره'}
    $('#pb').onclick=async()=>{
      const b=$('#pb');
      if(!b||b.classList.contains('ld'))return;
      if(stream&&stream.active&&visReady&&idPassed){step2();return}
      setErr('');
      b.classList.add('ld');
      try{
        /* بارگذاری مدل‌ها همزمان با پنجرهٔ اجازهٔ دوربین شروع می‌شود */
        const pVis=visReady?Promise.resolve(true):loadVision().then(()=>true,()=>false);
        const pDesc=idDescs?Promise.resolve(idDescs):getIdDescs();pDesc.catch(()=>{});
        const pFace=idReady?Promise.resolve(true):loadFaceId().then(()=>true);pFace.catch(()=>{});
        if(!(stream&&stream.active)){
          idPassed=false;idRefs=[];
          const s=await getMedia();
          if(!xm.isConnected){s.getTracks().forEach(t=>t.stop());return}
          if(!s.getVideoTracks().length||!s.getAudioTracks().length){s.getTracks().forEach(t=>t.stop());throw Error('no_media')}
          stream=s;
        }
        showPrev();
        if(!idDescs){
          b.textContent='در حال آماده‌سازی…';
          try{idDescs=await pDesc}catch(x){setErr(msg(x));b.textContent='اجازه دسترسی';renderMain();return}
        }
        if(!idReady){
          try{await pFace;idReady=true}
          catch{b.textContent='تلاش دوباره';setErr('تطبیق چهره بارگذاری نشد؛ اینترنت را بررسی کنید و دوباره بزنید. بدون تأیید چهره امکان ورود به آزمون وجود ندارد.');return}
        }
        if(!idPassed){
          b.textContent='در حال تطبیق چهره…';
          if(fvCtl)fvCtl.alive=false;
          const ctl=fvCtl={alive:true};
          const res=await verifyEntry(xm.querySelector('#pv'),idDescs,ui,ctl);
          if(!ctl.alive||!xm.isConnected)return;
          if(!res.ok){ui('تأیید نشد؛ دوباره تلاش کنید','bad',0,5);setErr(res.msg);b.textContent='تلاش دوباره';return}
          idRefs=res.refs;idPassed=true;passAt=Date.now();
          ui('چهره تأیید شد ✓','ok',5,5);
        }
        if(!visReady){
          b.textContent='در حال آماده‌سازی نظارت هوشمند…';
          if(await pVis)visReady=true;
          else if(++visTry>=2){visReady=true;setErr('نظارت هوشمند بارگذاری نشد؛ آزمون ادامه می‌یابد و این موضوع برای مدیر ثبت می‌شود.')}
          else{b.textContent='تلاش دوباره';setErr('نظارت هوشمند بارگذاری نشد؛ اینترنت را بررسی کنید و دوباره بزنید.');return}
        }
        b.textContent='چهره تأیید شد — ادامه';
      }catch(x){
        if(xm.isConnected){setErr(mediaErrText(x));b.textContent='تلاش دوباره';noCamCheck(x)}
      }finally{b.classList.remove('ld')}
    };
  }
  function step2(){
    xm.innerHTML=`<div class=wz>${stp(1)}<div class=wz-i>${ic('shield',38)}</div><h2>توجه توجه</h2>
    <p>در زمانی که آزمون می‌دهید:</p>
    <ul class=rules><li>دسترسی به دوربین‌های دستگاه شما فعال شده و شما زیر نظر هستید.</li><li>دسترسی میکروفون فعال می‌شود و صدای شما زیر نظر است.</li><li>نوشتن روی برگه ثبت می‌شود.</li><li>نگاه کردن به جای دیگر به منظور تقلب ثبت می‌شود.</li><li>اسکرین‌شات و اسکرین‌رکورد ثبت می‌شود (منجر به کم شدن نمره می‌شود).</li><li>استفاده از ابزارهای مخرب سایت برای دسترسی و هک کردن عمل نخواهد کرد و زمان خود را تلف می‌کنید.</li><li>اگر با تلفن، تبلت یا دوربینی دیگر از صفحهٔ گوشی بخواهید عکس بگیرید، آزمون برای شما قفل می‌شود و باز نخواهد شد؛ باید به مدیر مدرسه مراجعه کنید.</li><li>استفاده از کتاب درسی به عنوان زیردستی تقلب محسوب می‌شود و در صورت استفاده ثبت و برای مدیر ارسال می‌شود.</li></ul>
    <label class=chk><input type=checkbox id=ag>قوانین را خوانده‌ام و می‌پذیرم</label><div class=perr id=pe></div>
    <button class="btn red blk" id=sb2>شروع آزمون</button><button class="btn gh blk" id=pc>انصراف</button></div>`;
    $('#pc').onclick=leave;
    $('#sb2').onclick=async()=>{
      if(!$('#ag').checked){$('#pe').textContent='برای ادامه باید قوانین را بپذیرید.';return}
      if(!stream||!stream.active){step1();return}
      if(!idPassed||!idRefs.length||Date.now()-passAt>120000){idPassed=false;step1();setErr('برای اطمینان، چهرهٔ شما باید دوباره تأیید شود.');return}
      const b=$('#sb2');b.classList.add('ld');
      try{
        const fsOK=document.documentElement.requestFullscreen&&!/iPhone|iPad|iPod/.test(navigator.userAgent);
        if(fsOK){try{await document.documentElement.requestFullscreen({navigationUI:'hide'})}catch{}}
        const r=await rpc('start_attempt',{p_exam:e.id,p_device:dev(),p_ua:navigator.userAgent});
        if(r&&r.error)throw Error(r.error);
        if(!r||!r.attempt)throw Error('خطایی رخ داد');
        const s=stream;stream=null; // مالکیت استریم به آزمون منتقل می‌شود
        await runExam(xm,s,r,leave,{descs:idRefs.slice(),anchor:idDescs,thr:REF_THR,athr:ANCHOR_THR,hard:5});
      }catch(x){
        b.classList.remove('ld');
        try{if(document.fullscreenElement)document.exitFullscreen()}catch{}
        const m=msg(x);toast(m,'err');$('#pe')&&($('#pe').textContent=m);
        if(['already_submitted','time_over','exam_not_found','window_closed'].includes(x.message))setTimeout(leave,1200);
      }
    };
  }
}

/* ---------- اجرای آزمون ---------- */
async function runExam(xm,stream,pl,leave,idn){
  const Q=pl.questions||[],AT=pl.attempt,EX=pl.exam;
  if(!Q.length){stream.getTracks().forEach(t=>t.stop());throw Error('این آزمون هنوز سوالی ندارد')}
  let A={...(pl.answers||{})},idx=0,skew=Date.parse(pl.server_now)-Date.now(),deadline=Date.parse(AT.deadline_at),dirty=false,finished=false,syncing=false,saveT=null,warnT=null,exLocked=false;
  const T=[];const seenKey='rr_seen_'+AT.id;
  xm.innerHTML=`<div class=xh><div class=xt><b>${esc(EX.title)}</b><small id=pc></small></div><span class=net id=net hidden>اتصال قطع</span><div class=tm id=tm>--:--</div><button class=ib id=pl aria-label="فهرست سوال‌ها">${ic('grid',22)}</button><div class=xpb><i id=pb></i></div></div>
  <div class=xb id=xb></div><video class=cam id=cam autoplay muted playsinline></video><div class=wn id=wn></div>`;
  const cam=$('#cam');cam.srcObject=stream;try{cam.play()}catch{}
  const showWarn=(t,ms)=>{const w=$('#wn');if(!w)return;w.textContent=t;w.classList.add('on');clearTimeout(warnT);warnT=setTimeout(()=>w.classList.remove('on'),ms||4800)};
  const lock=(id,html,bindFn)=>{let e=xm.querySelector('#lk-'+id);if(!e){e=H('div','lk'+(['face','vio','obj','app','gz','pz','cw'].includes(id)?' opq':''));e.id='lk-'+id;xm.append(e)}if(e.__h!==html){e.querySelectorAll('video').forEach(v=>{v.srcObject=null});e.innerHTML=html;e.__h=html;bindFn&&bindFn(e)}xm.classList.add('hl')};
  const unlock=id=>{const e=xm.querySelector('#lk-'+id);if(e){e.querySelectorAll('video').forEach(v=>{v.pause();v.srcObject=null});e.remove()}if(!xm.querySelector('.lk'))xm.classList.remove('hl')};
  let vioActive=false,vioSaved=false,vioSavedAt=0,lastVioKind='';
  const camBind=e=>{const v=e.querySelector('video');if(v){v.srcObject=cam.srcObject;v.play().catch(()=>{})}};
  const FACE_TXT={no_face:'برای ادامهٔ آزمون صورت خود را جلوی دوربین قرار دهید.',dark:'تصویر دوربین تاریک است یا پوشیده شده؛ برای ادامهٔ آزمون صورت خود را روشن و جلوی دوربین قرار دهید.',frozen:'تصویر دوربین ثابت مانده است؛ برای ادامهٔ آزمون دوربین را بررسی کنید و صورت خود را جلوی آن قرار دهید.',partial:'بخشی از صورت شما دیده نمی‌شود یا واضح نیست. کل صورت را کامل، روشن و وسط کادر قرار دهید و چیزی جلوی آن نگیرید.',far:'صورت شما از دوربین خیلی دور است. کمی نزدیک‌تر شوید تا کل صورت واضح دیده شود.'};
  FACE_TXT.angled='صورت شما از کنار دیده می‌شود و هویت قابل تأیید نیست. برای ادامه صاف و رو به دوربین بنشینید.';
  FACE_TXT.mismatch='چهرهٔ جلوی دوربین با چهرهٔ احراز هویت‌شده مطابقت ندارد. فقط خود دانش‌آموز باید جلوی دوربین باشد؛ رو به دوربین بنشینید.';
  let paused=false,frozenRem=0,gzBusy=false,tok=null;
  const refreshTok=async()=>{try{const{data}=await sb.auth.getSession();tok=(data&&data.session&&data.session.access_token)||tok}catch{}};
  refreshTok();T.push(setInterval(refreshTok,20000));
  const PZ_OPTS=['مادر، پدر یا یکی از اعضای خانواده صدایم کرد','زنگ در خانه را زدند','تلفن یا تماس مهمی داشتم','کار ضروری دیگری پیش آمد','مورد دیگر'];
  const CW_TXT={question_copy_exit:'شما صورت سوال را روی برگه نوشتید و از برنامه خارج شدید؛ این کار تقلب محسوب می‌شود. گزارش همراه با مدرک (عکس) برای مدیر ارسال شد.',rear_phone:'دیده شد که با دستگاه دیگری از برگه‌تان عکس می‌گیرید؛ این کار تقلب محسوب می‌شود و گزارش همراه با مدرک برای مدیر ارسال شد.',cheat_admitted:'نوشتن صورت سوال برای تقلب، تقلب محسوب می‌شود و گزارش آن برای مدیر ارسال شد. تکرار آن آزمون را قفل می‌کند.'};
  async function pauseCall(ex){
    const body={p_attempt:AT.id,p_reason:String(ex.sound||'sound')};
    if(tok){try{const r=await fetch(SBU+'/rest/v1/rpc/pause_attempt',{method:'POST',keepalive:true,headers:{apikey:KEY,Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify(body)});if(r.ok)return await r.json()}catch{}}
    return await rpc('pause_attempt',body);
  }
  async function startPause(ex){
    frozenRem=deadline-(Date.now()+skew);
    paused=true;pr.setPaused(true);unlock('face');
    lock('pz',`<div class=wz-i>${ic('warn',38)}</div><h2>زمان آزمون متوقف شد</h2><p>صدایی شنیده شد و شما از آزمون دور شدید. زمان آزمون تا بازگشت شما متوقف است (حداکثر ۳ دقیقه).</p>`);
    let r=null;try{r=await pauseCall(ex)}catch{}
    if(!r||!r.ok){
      paused=false;pr.setPaused(false);unlock('pz');pr.refresh();
      if(r&&r.reason==='limit')showWarn('سقف توقف زمان آزمون تمام شده است');
    }
  }
  function showPauseForm(){
    lock('pz',`<div class=wz-i>${ic('warn',38)}</div><h2>کجا بودید؟</h2><p>چه کاری انجام می‌دادید؟ پاسخ شما برای مدیر ثبت می‌شود و سپس آزمون ادامه پیدا می‌کند.</p><div class=appopts>${PZ_OPTS.map(a=>`<button data-r="${esc(a)}">${esc(a)}</button>`).join('')}</div><input class=inp id=pzn maxlength=120 placeholder="توضیح کوتاه (اختیاری)" style="margin-top:.7rem">`,e=>{e.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>doResume(b.dataset.r,(e.querySelector('#pzn')||{}).value||''))});
  }
  async function doResume(reason,note){
    if(!paused||gzBusy)return;gzBusy=true;
    let r=null;
    for(let i=0;i<3&&!r;i++){try{r=await rpc('resume_attempt',{p_attempt:AT.id,p_reason:String(reason).slice(0,60),p_note:String(note).slice(0,200)})}catch{await sleep(800)}}
    if(r&&r.deadline_at){deadline=Date.parse(r.deadline_at);if(r.server_now)skew=Date.parse(r.server_now)-Date.now()}
    else deadline=Date.now()+skew+frozenRem;
    paused=false;pr.setPaused(false);gzBusy=false;unlock('pz');pr.refresh();
    showWarn('آزمون ادامه یافت؛ زمان از همان‌جا که متوقف شد ادامه دارد');
  }
  async function gzChoose(c,info){
    if(gzBusy)return;gzBusy=true;
    const wantDraft=(c==='draft'||c==='drawing')&&info.canDraft;
    if(wantDraft)lock('gz',`<div class=wz-i>${ic('camera',38)}</div><h2>صفحهٔ چک‌نویس خود را در کادر قرار دهید</h2><p>سریع؛ فقط ۸ ثانیه وقت دارید.</p><video class=lkv id=drv autoplay muted playsinline style="transform:none;max-height:44dvh"></video><div class=vst id=drt>۸</div>`);
    else lock('gz',`<div class=spin></div><h2>در حال ثبت…</h2>`);
    const ui={show:st=>{const v=xm.querySelector('#drv');if(v){v.srcObject=st;v.play().catch(()=>{})}},tick:n=>{const t=xm.querySelector('#drt');if(t)t.textContent=fn(n)},hide:()=>{const v=xm.querySelector('#drv');if(v){v.pause();v.srcObject=null}}};
    let res=null;try{res=await pr.gazeAnswer(c,ui)}catch{}
    unlock('gz');gzBusy=false;
    if(res&&!res.unavailable){
      if(res.bad)showWarn('برگهٔ چک‌نویس خالی، ناقص یا نامرتبط بود و برای مدیر ثبت شد. تکرار نگاه به جای دیگر آزمون را قفل می‌کند.',7000);
      else showWarn('ثبت شد؛ می‌توانید ادامه دهید.',3500);
    }
  }
  const OBJ_FA={remote:'کنترل یا دستگاه کوچک',laptop:'لپ‌تاپ',tv:'صفحهٔ نمایش دیگر',keyboard:'کیبورد',mouse:'ماوس',book:'کتاب یا جزوه',scissors:'قیچی',handbag:'کیف',backpack:'کوله‌پشتی',suitcase:'چمدان',umbrella:'چتر',tie:'کراوات','hair drier':'سشوار'};
  const APPS=['پیام‌رسان (تلگرام، بله، ایتا…)','مرورگر یا جستجو','گالری، عکس یا فایل','تماس، پیامک یا اعلان','ماشین‌حساب، یادداشت یا تقویم','برنامهٔ دیگر','نمی‌دانم؛ خودکار بود'];
  const VIO_TXT={gaze_repeat:'نگاه به جای دیگر پس از هشدار تکرار شد',face_mismatch:'چهرهٔ جلوی دوربین با چهرهٔ احراز هویت‌شده مطابقت ندارد',phone_detected:'گوشی یا دستگاه دیگری در تصویر دیده شد',suspicious_object:'وسیلهٔ مشکوک (دستگاه یا ابزار کمکی) در تصویر دیده شد',multiple_faces:'بیش از یک نفر در تصویر دیده شد'};
  const pr=createProctor({attemptId:AT.id,examId:EX.id,stream,video:cam,record:EX.record_media!==false,warn:showWarn,identity:idn&&!idn.skipped?idn:null,
    onNotice:(t,ms)=>{if(!finished)showWarn(t,ms)},
    questionsText:Q.map((q,i)=>(i+1)+') '+q.body).join('\n').slice(0,3500),
    onExcuse:ex=>{if(finished||vioActive||paused||exLocked){pr.setPaused(false);return}startPause(ex)},
    onReturn:()=>{if(paused&&!finished&&!vioActive)showPauseForm()},
    onGazePrompt:info=>{
      if(finished||vioActive||paused||exLocked){pr.gazeAnswer('skip');return}
      lock('gz',`<div class=wz-i>${ic('warn',38)}</div><h2>دارید چه کاری انجام می‌دهید؟</h2><p>مجموع نگاه شما به جای دیگر از ۳۰ ثانیه بیشتر شد.${info.rearBad?' تصویر دوربین پشت گوشی مشکی یا نامشخص است.':''} لطفاً صادقانه انتخاب کنید:</p><div class=appopts><button data-c=draft>به عنوان چک‌نویس استفاده می‌کنم</button><button data-c=drawing>نقاشی می‌کشم</button><button data-c=admit>صورت سوال را برای تقلب می‌نویسم</button><button data-c=other>کار دیگری (مثلاً فکر کردن)</button></div>`,e=>{e.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>gzChoose(b.dataset.c,info))});
    },
    onCheatWarn:k=>{
      if(finished)return;
      lock('cw',`<div class=wz-i>${ic('warn',38)}</div><h2>هشدار تقلب</h2><p>${CW_TXT[k]||'رفتار مشکوک ثبت و برای مدیر ارسال شد.'}</p><button class="btn red blk" id=cwb>متوجه شدم</button>`,e=>{e.querySelector('#cwb').onclick=()=>unlock('cw')});
    },
    onObject:st=>{
      if(finished)return;
      if(!st.active){unlock('obj');return}
      if(vioActive||paused)return;
      lock('obj',`<div class=wz-i>${ic('warn',38)}</div><h2>وسیله‌ای در تصویر دیده شد</h2><p>«${OBJ_FA[st.name]||'وسیلهٔ ناشناخته'}» در تصویر دیده شد و برای مدیر ثبت شد. لطفاً آن را از جلوی دوربین دور کنید؛ ۳ ثانیه بعد از دور شدن، آزمون خودکار باز می‌شود.</p><video class=lkv autoplay muted playsinline></video>`,camBind);
    },
    askApp:(ms,cb)=>{
      if(finished||vioActive||paused)return;
      lock('app',`<div class=wz-i>${ic('warn',38)}</div><h2>از صفحهٔ آزمون خارج شدید</h2><p>مدت ${fdur(ms)} از آزمون دور بودید و این رویداد برای مدیر ثبت شد. برای ادامه بگویید به کدام برنامه رفتید؛ پاسخ شما در گزارش ثبت می‌شود.</p><div class=appopts>${APPS.map(a=>`<button data-o="${esc(a)}">${esc(a)}</button>`).join('')}</div>`,e=>{e.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{try{cb(b.dataset.o)}catch{}unlock('app')})});
    },
    onStream:s=>{cam.srcObject=s;xm.querySelectorAll('.lkv').forEach(v=>{v.srcObject=s})},
    onFace:(ok,why)=>{
      if(finished||vioActive||paused)return;
      if(ok)unlock('face');
      else lock('face',`<div class=wz-i>${ic('camera',38)}</div><h2>صورت شما در کادر نیست</h2><p>${FACE_TXT[why]||FACE_TXT.no_face}</p><video class=lkv autoplay muted playsinline></video>`,camBind);
    },
    onViolation:(kind)=>{
      if(finished)return;lastVioKind=kind;
      vioActive=true;vioSaved=false;vioSavedAt=0;
      unlock('face');unlock('ex');unlock('obj');unlock('app');
      lock('vio',`<div class=wz-i>${ic('warn',38)}</div><h2>آزمون قفل شد</h2><p>نظارت هوشمند فعالیت مشکوک شناسایی کرد: ${VIO_TXT[kind]||'رفتار مشکوک'}. گزارش همراه با تصویر برای مدیر ارسال می‌شود و تا بررسی مدیر امکان ادامه وجود ندارد. صفحه را نبندید؛ زمان آزمون ادامه دارد.</p><div class=vst id=vst>در حال ارسال گزارش برای مدیر…</div>`);
    },
    onViolationSaved:()=>{
      vioSaved=true;vioSavedAt=Date.now();
      const t=xm.querySelector('#vst');if(t)t.textContent='گزارش برای مدیر ارسال شد ✓ — منتظر بررسی مدیر بمانید.';
    },
    onLock:l=>{
      if(finished)return;
      if(l.type==='fullscreen')lock('fs',`<div class=wz-i>${ic('warn',38)}</div><h2>خروج از تمام‌صفحه</h2><p>برای ادامهٔ آزمون باید به حالت تمام‌صفحه برگردید. این رویداد برای مدیر ثبت شد.</p><button class="btn red blk" id=lkb>بازگشت به تمام‌صفحه</button>`,e=>{e.querySelector('#lkb').onclick=()=>pr.enterFullscreen()});
      else lock('md',`<div class=wz-i>${ic('camera',38)}</div><h2>دوربین یا میکروفون قطع شد</h2><p>برای ادامهٔ آزمون باید دوربین و میکروفون فعال باشند. این رویداد برای مدیر ثبت شد.</p><div class=perr id=lke style="color:#ffb3b9"></div><button class="btn red blk" id=lkb>فعال‌سازی دوباره</button>`,e=>{e.querySelector('#lkb').onclick=async()=>{try{await pr.reacquire()}catch{e.querySelector('#lke').textContent='فعال‌سازی نشد؛ اجازهٔ دسترسی را بررسی کنید.'}}});
    },
    onUnlock:t=>unlock(t==='fullscreen'?'fs':'md')});
  lock('face',`<div class=wz-i>${ic('camera',38)}</div><h2>صورت خود را جلوی دوربین قرار دهید</h2><p>${FACE_TXT.no_face}</p><video class=lkv autoplay muted playsinline></video>`,camBind);
  T.push(setInterval(()=>{if(vioActive&&!finished&&!xm.querySelector('#lk-vio')){const k=lastVioKind;lock('vio',`<div class=wz-i>${ic('warn',38)}</div><h2>آزمون قفل شد</h2><p>فعالیت مشکوک شناسایی شد. منتظر بررسی مدیر بمانید.</p>`)}},400));
  await pr.start();
  if(AT.paused_at){try{const r=await rpc('resume_attempt',{p_attempt:AT.id,p_reason:'reload',p_note:null});if(r&&r.deadline_at){deadline=Date.parse(r.deadline_at);if(r.server_now)skew=Date.parse(r.server_now)-Date.now()}}catch{}}
  if(idn&&idn.skipped)pr.log('detector_off',{reason:'identity_model'},null,{force:true});
  // بازگشت به آزمونِ نیمه‌تمام: مدت غیبت
  try{const prev=+localStorage.getItem(seenKey)||0;if(prev&&Date.now()-prev>8000)pr.log('app_exit',{reason:'reopen'},Date.now()-prev,{photo:true})}catch{}
  const beat=()=>{try{localStorage.setItem(seenKey,String(Date.now()))}catch{}};beat();T.push(setInterval(beat,3000));

  /* نمایش همهٔ سوال‌ها زیر هم */
  const answered=q=>String(A[q.id]??'').trim()!=='';
  const grow=t=>{t.style.height='auto';t.style.height=Math.min(Math.max(t.scrollHeight+2,140),640)+'px'};
  const palHTML=()=>`<div class=pal>${Q.map((q,i)=>`<button type=button class="${answered(q)?'dn':''}" data-i=${i}>${fn(i+1)}</button>`).join('')}</div><div class=legend><span><i style="background:var(--blue)"></i>پاسخ داده شده</span><span><i style="background:#fff;border:1px solid #ccd"></i>بی‌پاسخ</span></div>`;
  const goQ=i=>{const el=document.getElementById('q-'+i);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})};
  function qCard(q,i){
    const opts=Array.isArray(q.options)?q.options:[];
    let inp='';
    if(q.type==='mcq')inp=`<div class=ops role=radiogroup>${opts.map((o,k)=>{const on=String(A[q.id])===String(k+1);return`<button type=button class="op ${on?'on':''}" role=radio aria-checked=${on} data-k="${k+1}"><span class=n>${fn(k+1)}</span><span>${esc(o)}</span></button>`}).join('')}</div>`;
    else if(q.type==='fill')inp=`<input class=inp data-in dir=auto autocomplete=off autocapitalize=off spellcheck=false placeholder="پاسخ را بنویسید" value="${esc(A[q.id]||'')}">`;
    else inp=`<textarea class=inp data-in rows=5 dir=auto spellcheck=false placeholder="پاسخ تشریحی خود را بنویسید">${esc(A[q.id]||'')}</textarea>`;
    return`<section class=qc id="q-${i}" data-qi="${i}"><div class=qmeta><span class=badge>سوال ${fn(i+1)} از ${fn(Q.length)}</span><span class="badge gr">${TYPE[q.type]||''}</span><span class="badge warn">${fn(q.points)} نمره</span></div><div class=qb>${esc(q.body)}</div>${inp}</section>`;
  }
  function paint(){
    const n=Q.filter(answered).length;
    const pc=$('#pc');if(pc)pc.textContent=`پاسخ‌داده‌شده ${fn(n)} از ${fn(Q.length)}`;
    const pb=$('#pb');if(pb)pb.style.width=(Q.length?n/Q.length*100:0)+'%';
    document.querySelectorAll('.pal button').forEach(b=>b.classList.toggle('dn',answered(Q[+b.dataset.i])));
  }
  function render(){
    const xb=$('#xb');
    xb.innerHTML=`<div class=xw><div class=xq id=xq>${Q.map(qCard).join('')}<div class=xend><button type=button class="btn red blk" id=fin>${ic('check',18)}پایان و ثبت آزمون</button></div></div><aside class=xs><b>فهرست سوال‌ها</b>${palHTML()}<button type=button class="btn red blk" id=fin2 style="margin-top:1rem">پایان و ثبت آزمون</button></aside></div>`;
    xb.querySelectorAll('textarea[data-in]').forEach(grow);
    xb.onclick=e=>{
      const b=e.target.closest('.op');
      if(b){
        const c=b.closest('.qc'),q=Q[+c.dataset.qi];
        A[q.id]=b.dataset.k;
        c.querySelectorAll('.op').forEach(x=>{const on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-checked',on)});
        change();paint();return;
      }
      const p=e.target.closest('.xs .pal button');if(p){goQ(+p.dataset.i);return}
      if(e.target.closest('#fin,#fin2'))confirmFinish();
    };
    xb.oninput=e=>{
      const t=e.target.closest('[data-in]');if(!t)return;
      const q=Q[+t.closest('.qc').dataset.qi];
      A[q.id]=t.value;if(t.tagName==='TEXTAREA')grow(t);
      change();paint();
    };
    paint();
  }
  function change(){dirty=true;clearTimeout(saveT);saveT=setTimeout(sync,1500)}
  $('#pl').onclick=()=>{
    const w=H('div','',`${palHTML()}<button type=button class="btn red blk" style="margin-top:1rem" id=pfin>پایان و ثبت آزمون</button>`);
    const m=modal('فهرست سوال‌ها',w,'mid');
    w.querySelector('.pal').onclick=e=>{const b=e.target.closest('button');if(b){m.close();setTimeout(()=>goQ(+b.dataset.i),120)}};
    w.querySelector('#pfin').onclick=()=>{m.close();confirmFinish()};
  };
  async function confirmFinish(){
    const un=Q.filter(q=>!answered(q)).length;
    const ok2=await ask(un?`<b>${fn(un)}</b> سوال بی‌پاسخ مانده است. آیا مطمئن هستید که می‌خواهید آزمون را پایان دهید؟`:'آیا مطمئن هستید که می‌خواهید آزمون را پایان دهید؟ پس از ثبت، امکان تغییر پاسخ‌ها وجود ندارد.',{ok:'بله، ثبت آزمون',cancel:'ادامه می‌دهم',danger:true,title:'پایان آزمون'});
    if(ok2)finish(false);
    else if(un){const f=Q.findIndex(q=>!answered(q));if(f>=0)goQ(f)}
  }

  /* ذخیره و همگام‌سازی */
  let again=false,rt=null;
  async function sync(){
    if(finished)return;if(syncing){again=true;return}syncing=true;
    const was=dirty,t0=Date.now();
    try{
      const send=dirty?{...A}:{};dirty=false;
      const r=await rpc('save_progress',{p_attempt:AT.id,p_answers:send});
      if(r){
        if(r.server_now)skew=Date.parse(r.server_now)-Date.now();
        if(r.deadline_at&&!paused)deadline=Date.parse(r.deadline_at);
        if(r.status&&r.status!=='in_progress'){syncing=false;return end(true)}
        applyLock(!!r.locked,t0);
      }
      $('#net')&&($('#net').hidden=true);
    }catch(x){
      dirty=dirty||was;$('#net')&&($('#net').hidden=false);
      if(/forbidden/.test(x.message||'')){syncing=false;return end(true)}
    }finally{syncing=false;if(again&&!finished){again=false;setTimeout(sync,0)}}
  }
  function applyLock(v,t0){
    if(vioActive){
      if(!v&&vioSaved&&t0>vioSavedAt){vioActive=false;vioSaved=false;unlock('vio');exLocked=false;showWarn('مدیر قفل را برداشت؛ آزمون را ادامه دهید');pr.resume()}
      return;
    }
    setExLock(v);
  }
  function setExLock(v){
    if(v===exLocked)return;exLocked=v;
    if(v)lock('ex',`<div class=wz-i>${ic('lock',38)}</div><h2>آزمون قفل شد</h2><p>آزمون توسط مدیر موقتاً قفل شده است. لطفاً صبر کنید و صفحه را نبندید. زمان آزمون ادامه دارد.</p>`);else unlock('ex');
  }
  setTimeout(()=>{if(!finished)T.push(setInterval(sync,5000))},Math.random()*2500);
  try{rt=sb.channel('att:'+AT.id).on('broadcast',{event:'chg'},()=>sync()).on('postgres_changes',{event:'UPDATE',schema:'public',table:'exams',filter:'id=eq.'+EX.id},()=>sync()).subscribe()}catch{}
  T.push(setInterval(()=>{
    const rem=paused?frozenRem:deadline-(Date.now()+skew),t=$('#tm');
    if(t){t.textContent=clock(rem);t.classList.toggle('lo',rem<60000)}
    if(rem<=0&&!finished&&!paused)finish(true);
  },500));
  const clearAll=()=>{T.forEach(clearInterval);clearTimeout(saveT);clearTimeout(warnT);try{rt&&sb.removeChannel(rt)}catch{}};

  /* پایان */
  async function finish(auto){
    if(finished)return;finished=true;clearAll();
    xm.innerHTML=`<div class=wz><div class=spin></div><h2>${auto?'زمان آزمون تمام شد':'در حال ثبت آزمون'}…</h2><p>پاسخ‌های شما در حال ارسال است. لطفاً صفحه را نبندید.</p></div>`;
    try{await pr.stop()}catch{}
    let tries=0;
    for(;;){
      try{await rpc('submit_attempt',{p_attempt:AT.id,p_answers:A});break}
      catch(x){
        if(/forbidden/.test(x.message||''))break;
        if(++tries>=5){
          await new Promise(res=>{xm.innerHTML=`<div class=wz><div class=wz-i>${ic('warn',38)}</div><h2>ثبت آزمون انجام نشد</h2><p>اتصال اینترنت خود را بررسی کنید. پاسخ‌های شما روی این صفحه محفوظ است؛ صفحه را نبندید.</p><button class="btn red blk" id=rt>تلاش مجدد</button></div>`;$('#rt').onclick=res});
          xm.innerHTML=`<div class=wz><div class=spin></div><h2>در حال ثبت آزمون…</h2></div>`;tries=0;
        }else await sleep(2000);
      }
    }
    end(false);
  }
  function end(already){
    finished=true;clearAll();
    if(already){try{pr.stop()}catch{}}
    try{localStorage.removeItem(seenKey)}catch{}
    try{pr.stream&&pr.stream.getTracks().forEach(t=>t.stop())}catch{}
    try{stream.getTracks().forEach(t=>t.stop())}catch{}
    try{if(document.fullscreenElement)document.exitFullscreen()}catch{}
    xm.innerHTML=`<div class=wz><div class="wz-i done-i">${ic('check',44)}</div><h2>آزمون شما ثبت شد</h2><p>پاسخ‌های شما با موفقیت ارسال شد. نمره پس از تصحیح توسط معلم و انتشار، در بخش «میزان نمره‌ها» نمایش داده می‌شود.</p><button class="btn red blk" id=bk>بازگشت به آزمون‌ها</button></div>`;
    $('#bk').onclick=leave;
  }
  render();
}

boot();
</script>
<script id="nocopy-js">(function(){
var ed=function(t){return t&&t.closest&&t.closest('input,textarea,[contenteditable="true"],[contenteditable=""]')};
var stop=function(e){e.preventDefault()};
document.addEventListener('contextmenu',stop,true);
document.addEventListener('dragstart',stop,true);
document.addEventListener('copy',function(e){e.preventDefault();try{e.clipboardData.setData('text/plain','')}catch(_){}},true);
document.addEventListener('cut',function(e){e.preventDefault();try{e.clipboardData.setData('text/plain','')}catch(_){}},true);
document.addEventListener('selectstart',function(e){if(!ed(e.target))e.preventDefault()},true);
document.addEventListener('keydown',function(e){
  var k=(e.key||'').toLowerCase(),c=e.ctrlKey||e.metaKey;
  if(c&&(k==='s'||k==='u'||k==='p'))return e.preventDefault();
  if(c&&(k==='c'||k==='x')&&!ed(e.target))return e.preventDefault();
  if(c&&k==='a'&&!ed(e.target))return e.preventDefault();
  if(k==='f12'||(c&&e.shiftKey&&(k==='i'||k==='j'||k==='c')))return e.preventDefault();
},true);
window.addEventListener('beforeprint',function(){document.documentElement.style.display='none'});
window.addEventListener('afterprint',function(){document.documentElement.style.display=''});
})();</script>
</body>
</html>
